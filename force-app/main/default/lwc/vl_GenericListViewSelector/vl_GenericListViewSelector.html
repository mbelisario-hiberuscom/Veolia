<template>
	<div class="slds-p-around_medium generic-list-view-selector">
		<header class="generic-header">
			<div class="header-titles">
				<lightning-icon class="header-icon" icon-name={icon} size="large" alternative-text=""></lightning-icon>
				<div>
					<h1 class="header-title">{title}</h1>
					<p class="header-subtitle">{subtitle}</p>
				</div>
			</div>
			<div class="header-actions">
				<template if:true={canCreateRecord}>
					<lightning-button
						variant="brand"
						label={createRecordLabel}
						icon-name="utility:add"
						onclick={handleNewRecord}
					></lightning-button>
				</template>
			</div>
		</header>
		<template if:true={shouldShowRecentlyViewedRecords}>
			<c-vl_-recently-viewed-records
				object-api-name={objectApiName}
				record-limit={recentlyViewedRecordLimit}
				field-api-names={recentlyViewedFieldApiNames}
				card-actions={recentlyViewedCardActions}
			></c-vl_-recently-viewed-records>
		</template>
		<div class="list-view-header">
			<div class="list-view-tabs" role="tablist" aria-label="List views">
				<template for:each={listViewButtons} for:item="listView">
					<button
						key={listView.developerName}
						type="button"
						class={listView.buttonClass}
						data-list-view-api-name={listView.developerName}
						aria-selected={listView.isSelected}
						onclick={handleListViewButtonClick}
						disabled={isLoadingListViews}
					>
						<template if:true={listView.isLoading}>
							<lightning-icon
								class="list-view-loading-icon"
								icon-name="utility:sync"
								alternative-text="Cargando"
								size="small"
							></lightning-icon>
						</template>
						<template if:false={listView.isLoading}>
							<lightning-icon icon-name="utility:record_collection" alternative-text="" size="small"></lightning-icon>
						</template>
						<span>{listView.label}</span>
						<c-vl_-generic-list-view-count
							object-api-name={objectApiName}
							list-view-api-name={listView.developerName}
							is-selected={listView.isSelected}
						></c-vl_-generic-list-view-count>
					</button>
				</template>
			</div>
		</div>
		<div class="data-content slds-is-relative">
			<c-vl_-generic-paginated-datatable
				data={records}
				columns={columns}
				column-options={allColumns}
				page-size={pageSize}
				results-label={searResultsLabel}
				is-loading={isLoading}
				is-loading-list-views={isLoadingListViews}
				has-selected-list-view={hasSelectedListView}
				default-sort-direction={defaultSortDirection}
				onpagesizechange={handlePageSizeChange}
				oncolumnsave={handleColumnSave}
			></c-vl_-generic-paginated-datatable>
			<!--<c-vl_-generic-grouped-datatable
				data={records}
				columns={columns}
				title="Resultados de la búsqueda"
				group-by-fields={groupedDatatableGroupByFields}
			></c-vl_-generic-grouped-datatable>-->
		</div>
	</div>
	<template lwc:if={isNewRecordFlowOpen}>
		<section
			role="dialog"
			tabindex="-1"
			aria-modal="true"
			aria-label={activeNewRecordFlowName}
			class="new-record-flow-modal slds-modal slds-fade-in-open"
		>
			<div class="slds-modal__container">
				<header class="slds-modal__header">
					<lightning-button-icon
						class="new-record-flow-close"
						icon-name="utility:close"
						alternative-text={closeLabel}
						title={closeLabel}
						onclick={closeNewRecordFlow}
					></lightning-button-icon>
					<h2 class="slds-modal__title slds-hyphenate">{createRecordLabel}</h2>
				</header>
				<div class="slds-modal__content slds-p-around_medium">
					<lightning-flow flow-api-name={activeNewRecordFlowName} onstatuschange={handleNewRecordFlowStatusChange}></lightning-flow>
				</div>
			</div>
		</section>
		<div class="slds-backdrop slds-backdrop_open"></div>
	</template>
</template>
